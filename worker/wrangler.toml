name = "eternal-notes-proxy"
main = "src/index.ts"
compatibility_date = "2026-03-31"

[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "INVITE_MANAGER", class_name = "InviteManager" },
  { name = "IP_RATE_LIMITER", class_name = "IpRateLimiter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "InviteManager"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IpRateLimiter"]

# KV namespace for allowlist cache (fast lookup during /upload)
# Source of truth = InviteManager DO. KV = read-through cache.
# Create via: wrangler kv namespace create ALLOWLIST
[[kv_namespaces]]
binding = "ALLOWLIST"
id = "8d9e7ee08bff44f793933d69718600ef"

# CF Pages cutover: add the real "https://<project>.pages.dev" (or custom domain)
# and drop the github.io origin once migrated. Do NOT wildcard preview domains
# (*.pages.dev change per deploy) — they must not reach the prod CORS allowlist.
[vars]
ALLOWED_ORIGINS = "https://yokogamma.github.io,http://localhost:5173"
MAX_BODY_BYTES = "51200"
RATE_LIMIT_PER_HOUR = "20"

# Secrets (via `wrangler secret put`):
# ARWEAVE_JWK — server Arweave wallet (JSON string)
# ADMIN_SECRET — bearer token for /admin/* endpoints
# RECOVERY_HMAC_SECRET — STABLE secret for recovery-token HMACs. Set once and
#   never rotate together with ARWEAVE_JWK (wallet rotation must not invalidate
#   outstanding recovery tokens; an unverifiable token fails closed). If it must
#   rotate, plan a dual-verify window (current + previous, keyed by `kid`).
