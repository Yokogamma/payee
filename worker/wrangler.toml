name = "eternal-notes-proxy"
main = "src/index.ts"
compatibility_date = "2026-03-31"

[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "INVITE_MANAGER", class_name = "InviteManager" },
  { name = "IP_RATE_LIMITER", class_name = "IpRateLimiter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "InviteManager"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IpRateLimiter"]

# KV namespace for allowlist cache (fast lookup during /upload)
# Source of truth = InviteManager DO. KV = read-through cache.
# Create via: wrangler kv namespace create ALLOWLIST
[[kv_namespaces]]
binding = "ALLOWLIST"
id = "8d9e7ee08bff44f793933d69718600ef"

# Production origin: https://notes.matamata.dev (Cloudflare Pages custom
# domain). The github.io origin stays until the legacy deployment is retired
# (the FIRST recovery rollout deploys the client there first — see
# docs/ROLLBACK.md). Do NOT wildcard preview domains (*.pages.dev change per
# deploy) — they must not reach the prod CORS allowlist.
[vars]
ALLOWED_ORIGINS = "https://notes.matamata.dev,https://yokogamma.github.io,http://localhost:5173"
MAX_BODY_BYTES = "51200"
RATE_LIMIT_PER_HOUR = "20"

# Secrets (via `wrangler secret put`):
# ARWEAVE_JWK — server Arweave wallet (JSON string)
# ADMIN_SECRET — bearer token for /admin/* endpoints
# RECOVERY_HMAC_SECRET — MANDATORY: /upload returns 503 while it is missing or
#   shorter than 16 chars (a triple-failure without a signed recovery hint would
#   end in a duplicate paid POST). Generate once: `openssl rand -base64 32`.
#   Keep it STABLE — never rotate together with ARWEAVE_JWK (outstanding tokens
#   would stop verifying and fail closed). If it ever must rotate, plan a
#   dual-verify window (current + previous, keyed by `kid`).
