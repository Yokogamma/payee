name = "matamata-notes-proxy"
main = "src/index.ts"
compatibility_date = "2026-03-31"

[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "INVITE_MANAGER", class_name = "InviteManager" },
  { name = "IP_RATE_LIMITER", class_name = "IpRateLimiter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "InviteManager"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IpRateLimiter"]

# KV namespace for allowlist cache (fast lookup during /upload)
# Source of truth = InviteManager DO. KV = read-through cache.
# Create via: wrangler kv namespace create ALLOWLIST
[[kv_namespaces]]
binding = "ALLOWLIST"
id = "8d9e7ee08bff44f793933d69718600ef"

# Production origin: https://notes.matamata.dev (Cloudflare Pages custom
# domain). The github.io origin stays until the legacy deployment is retired
# (the FIRST recovery rollout deploys the client there first — see
# docs/ROLLBACK.md). Do NOT wildcard preview domains (*.pages.dev change per
# deploy) — they must not reach the prod CORS allowlist.
[vars]
ALLOWED_ORIGINS = "https://notes.matamata.dev,https://yokogamma.github.io,http://localhost:5173"
MAX_BODY_BYTES = "51200"
RATE_LIMIT_PER_HOUR = "20"
# v3 upload kill switch. STRICTLY "true" enables; anything else fails CLOSED
# (v3 uploads get 503 {code:'v3_uploads_disabled'}, v1/v2 unaffected).
# SOURCE OF TRUTH is this file: toggling = edit here + `npm run deploy` from the
# verified v3-acceptor tag. A Cloudflare-dashboard override is EMERGENCY-ONLY
# and must be synced back here immediately (the next deploy would silently
# restore the repo value). Verify after EVERY worker deploy:
#   curl https://<worker>/health  →  "v3Uploads" matches the intended state.
V3_UPLOADS_ENABLED = "true"
# v4 (safebox) upload kill switch — SAME contract as V3_UPLOADS_ENABLED, on its
# own switch so pausing one version never stops the other. Strictly "true"
# enables; anything else fails CLOSED (503 {code:'v4_uploads_disabled'}).
# Verify after EVERY worker deploy:
#   curl https://<worker>/health  →  "v4Uploads" matches the intended state.
V4_UPLOADS_ENABLED = "true"

# Secrets (via `wrangler secret put`):
# ARWEAVE_JWK — server Arweave wallet (JSON string)
# ADMIN_SECRET — bearer token for /admin/* endpoints
# RECOVERY_HMAC_SECRET — MANDATORY: /upload returns 503 while it is missing or
#   shorter than 16 chars (a triple-failure without a signed recovery hint would
#   end in a duplicate paid POST). Generate once: `openssl rand -base64 32`.
#   Keep it STABLE — never rotate together with ARWEAVE_JWK (outstanding tokens
#   would stop verifying and fail closed). If it ever must rotate, plan a
#   dual-verify window (current + previous, keyed by `kid`).

# ─── Staging environment ─────────────────────────────────────────────
# Fully isolated stand-in for the mandatory pre-W3 signed v3 smoke
# (worker/scripts/smoke-v3.mjs). A named environment inherits NOTHING —
# vars, KV, DO bindings, migrations and secrets are all declared explicitly.
#
# OPERATOR PREREQUISITES (once, before first `npm run deploy:staging`):
#   1. wrangler kv namespace create ALLOWLIST --env staging
#      → paste the returned id below (placeholder deploys will fail until then).
#   2. wrangler secret put ARWEAVE_JWK --env staging        (DEDICATED test JWK,
#      minimal AR balance — never the production wallet)
#   3. wrangler secret put ADMIN_SECRET --env staging       (staging-only value)
#   4. wrangler secret put RECOVERY_HMAC_SECRET --env staging (staging-only)
#   5. Register the smoke test key via an invite seeded through
#      /admin/seed-invite + /register (InviteManager is the source of truth —
#      never hand-write pk: entries into KV).
# Config gate before any real staging deploy:
#   npm run deploy:staging:check   (wrangler deploy --env staging --dry-run)
#
# NOTE on origins: the workers.dev URL below is the API ENDPOINT, not a client
# origin. CLI smoke sends no Origin header (CORS is not exercised); a browser
# CORS check needs a staging CLIENT page whose origin is what belongs in
# ALLOWED_ORIGINS here.
[env.staging]
name = "matamata-notes-proxy-staging"

[env.staging.durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "INVITE_MANAGER", class_name = "InviteManager" },
  { name = "IP_RATE_LIMITER", class_name = "IpRateLimiter" }
]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "InviteManager"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["IpRateLimiter"]

[[env.staging.kv_namespaces]]
binding = "ALLOWLIST"
id = "STAGING_KV_ID_PLACEHOLDER_CREATE_VIA_WRANGLER"

[env.staging.vars]
ALLOWED_ORIGINS = "http://localhost:5173"
MAX_BODY_BYTES = "51200"
RATE_LIMIT_PER_HOUR = "20"
V3_UPLOADS_ENABLED = "true"
V4_UPLOADS_ENABLED = "true"
