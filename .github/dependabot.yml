version: 2

# ПОЧЕМУ ЗДЕСЬ ГРУППЫ. Без них каждое обновление приезжает отдельным PR: три
# экосистемы × еженедельная проверка. К 20.08.2026 накопилось 15 открытых PR,
# самому старому месяц, часть из них старше файла ci.yml — то есть гейты на них
# не запускались НИ РАЗУ. Очередь, которую не разбирают, от CVE не защищает.
#
# Хуже: без групп Dependabot разрезает пакеты, обязанные двигаться вместе. Так
# появились PR #12 (react) и #17 (react-dom): каждый по отдельности роняет ВСЕ
# .tsx-тесты с «Incompatible React versions: react 19.2.8 / react-dom 19.2.4».
#
# ГРАНИЦЫ ГРУПП — ПО ДОМЕНАМ, А НЕ «ВСЁ В ОДИН PR». Один зелёный прогон
# доказывает, что сборка не развалилась, но НЕ доказывает сохранность
# криптографических, sync- и restore-инвариантов. Поэтому пакеты, от которых
# зависят ключи, подписи, хранилище и офлайн, обновляются ПООДИНОЧКЕ даже в
# minor — их PR должен быть маленьким и читаемым, а откат — точечным.
#
# Что НЕ группируется (умышленно, каждый своим PR):
#   @noble/ed25519, @noble/hashes  — подписи и хеши
#   @scure/bip39                   — мнемоника: цена ошибки = потеря сейфа
#   hash-wasm                      — Argon2id, обёртка PIN
#   arweave                        — протокол публикации
#   idb                            — IndexedDB, весь локальный слой
#   vite-plugin-pwa                — service worker, офлайн и обновления
#   @types/node                    — версия типов обязана соответствовать .nvmrc
#
# Мажоры не группируются нигде: группы объявлены с update-types [minor, patch].
# Security-обновления тоже приезжают ОТДЕЛЬНЫМИ PR: группы по умолчанию
# относятся только к version-updates (applies-to: version-updates), и это здесь
# осознанно — фикс CVE не должен ждать своей еженедельной пачки.
#
# open-pull-requests-limit — дефолтные 5. Временный подъём до 10 (нужен был,
# чтобы сгруппированным PR было куда приехать при забитой очереди 5/5/5)
# закончился вместе с разбором очереди 2026-08-21: группы приехали, мажоры
# разобраны поштучно, слоты свободны.
updates:
  # ── GitHub Actions ────────────────────────────────────────────────────
  # Actions are pinned to immutable commit SHAs; without this they would never
  # receive security fixes. Dependabot bumps the SHA and rewrites the trailing
  # version comment.
  #
  # Мажоры сюда не попадают намеренно: у экшенов мажор — это смена рантайма
  # (node20 → node24) и входных параметров, плюс ручная сверка, что новый SHA
  # принадлежит заявленному тегу. И отдельно: три из четырёх воркфлоу —
  # деплойные и `workflow_dispatch`-only, то есть CI их НЕ проверяет.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        patterns:
          - "*"
        # wrangler-action — вне группы: checkout и setup-node прогоняет ci.yml
        # на самом же PR Dependabot'а, а wrangler-action живёт только в
        # workflow_dispatch-деплоях, которые CI не запускает — его бампы никто
        # не проверяет автоматически. Отдельный PR = ручная сверка SHA↔тега
        # и репетиция деплоя до мержа.
        exclude-patterns:
          - cloudflare/wrangler-action
        update-types:
          - minor
          - patch

  # ── Клиент ────────────────────────────────────────────────────────────
  # Dev-toolchain CVEs (Vite/Wrangler/Miniflare chains) reached us via manual
  # audits twice — keep both manifests watched.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Связанная четвёрка: react и react-dom обязаны совпадать до патча,
      # типы ходят с ними. Ровно та пара, расщепление которой дало #12/#17.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      # Рендер markdown: отдельно от остального, потому что регрессия здесь
      # видна как «поехала карточка заметки», и откатывать надо точечно.
      markdown:
        patterns:
          - react-markdown
          - remark-*
          - unified
          - "@types/mdast"
        update-types:
          - minor
          - patch
      # Инструменты: не попадают в рантайм пользователя.
      tooling:
        patterns:
          - eslint
          - eslint-*
          - "@eslint/*"
          - typescript-eslint
          - globals
          - typescript
          - vite
          - "@vitejs/*"
          - vitest
          - jsdom
          - fake-indexeddb
          - "@testing-library/*"
        update-types:
          - minor
          - patch
      # Шрифты прекешируются service worker'ом и считаются в бюджет бандла —
      # держим отдельно, чтобы `check-no-inlined-fonts` и бюджет были читаемы.
      fonts:
        patterns:
          - "@fontsource/*"
          - "@fontsource-variable/*"
        update-types:
          - minor
          - patch
    # ПАРКОВКА МАЖОРНЫХ ЛИНИЙ — решение владельца от 2026-08-20, диапазоном,
    # а не одним мажором (иначе выход TS 8 / Node 27 молча вернул бы PR):
    #   typescript >=7   — typescript-eslint поддерживает TS <6.1, совместного
    #                      переезда нет; обе половины репозитория обязаны
    #                      переехать одновременно;
    #   @types/node >=25 — типы обязаны совпадать с engines ^24 (.nvmrc).
    # ВНИМАНИЕ: ignore глушит и security-обновления этих линий. Alert придёт,
    # но автоматического fix-PR НЕ будет — увидеть alert, решить и обновить
    # руками. Компенсирующий контроль — Dependabot alerts, которые обязаны
    # быть включены ДО мержа этого файла.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: "@types/node"
        versions: [">=25"]

  # ── Worker ────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Тестовый стек worker'а движется как одно целое: vitest и
      # vitest-pool-workers связаны версиями, wrangler и workers-types — средой.
      # В 0.x минор ведёт себя как мажор, поэтому гейт здесь — worker-тесты,
      # а не сам факт зелёного ярлыка.
      worker-tooling:
        patterns:
          - vitest
          - "@cloudflare/*"
          - wrangler
          - typescript
        update-types:
          - minor
          - patch
    # @noble/ed25519 и arweave в worker'е не группируются: это проверка подписей
    # и протокол публикации — каждый своим PR.
    #
    # Та же парковка TS-мажора >=7, что и у клиента: worker не должен уезжать
    # на новый мажор в одиночку (урок закрытого PR #8). Обе половины выровнены
    # на 6.0.3 (2026-08-21). Про заглушенные security-обновления линии — см.
    # комментарий у корневого ignore.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
