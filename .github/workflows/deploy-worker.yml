name: Deploy Worker (proxy)

# Manual trigger, intentionally decoupled from the Pages deploy so the operator
# controls the reader-before-writer sequence:  Worker → smoke → Pages.
# NOTE: a workflow_dispatch workflow must already exist on the default branch
# before it can be run from the Actions UI, so land this file in main FIRST
# (both deploys here are manual, so merging does not auto-publish anything).
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix worker ci
      - run: npm --prefix worker run typecheck
      - run: npm --prefix worker test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
