name: Deploy Worker (proxy) — dev

# Deploys the WORKING (dev) contour worker (contour reclassified 2026-08-20;
# the future production gets its own `… — production` workflow, never this one).
# Manual trigger, intentionally decoupled from the client deploys so the
# operator controls the sequence (authoritative order: docs/ROLLBACK.md).
#   Release order: Worker → smoke → Pages (reader-before-writer). The first
#   recovery-protocol rollout used a special order — recorded in ROLLBACK.md
#   as history; the legacy GitHub Pages origin is retired.
#
# ── The candidate is an INPUT, and it must be ON the default branch ──
#
# This workflow deploys the commit named in `candidate`. It is dispatched from
# the DEFAULT BRANCH, which is where its own steps, `check-worker-floor.mjs`
# and `check-deploy-config.mjs` come from.
#
# The reason is the reason the token is not handed to repo scripts either: a
# workflow_dispatch takes its workflow FROM THE REF IT IS DISPATCHED WITH, so a
# gate living in the deployed code could be edited by the very commit it is
# meant to judge. Passing the candidate as a SHA separates «the code being
# deployed» from «the code deciding whether it may be».
#
# But a free-form SHA would ALSO separate the deployed code from branch
# protection, which is worse than the arrangement it replaced. So the gate
# requires the candidate to be REACHABLE FROM THE TRUSTED HEAD — every commit
# the default branch ever contained, so rollbacks keep working, and nothing
# else. There is no second checkout either: the candidate is materialized with
# `git worktree` out of the history already fetched here, so nothing is pulled
# from the network after the gate has spoken.
#
# ── TWO jobs, and the boundary between them is the token ──────────────
#
# The candidate's OWN code — its npm lifecycle scripts, its test suite — runs
# in `test-candidate`, a job with NO Environment and therefore no secret. It
# used to run in the same job that later received the Cloudflare token, with
# a `git checkout --force` in between; that is not a boundary. Code that has
# executed on a runner can outlive a checkout through the index, through
# untracked `node_modules`, through `$GITHUB_ENV` and `$GITHUB_PATH` — and the
# token would then be handed to whatever it left behind.
#
# `deploy-worker` therefore starts on a FRESH runner, materializes the SHA
# again from its own fetched history, and never EXECUTES candidate code:
# dependency installs run with `--ignore-scripts` (node_modules are data for
# the bundler, not a program), and wrangler bundles sources without running
# them. What it deploys is exactly the bytes the gates judged, on a machine
# where nothing else has run.
#
# Residual, named rather than hidden: wrangler itself is resolved from the
# candidate's `worker/node_modules`, i.e. from the candidate's reviewed
# lockfile — the same trust level as this branch's own lockfile, but for a
# rollback it is an OLDER review. Running the trusted checkout's wrangler over
# the candidate's config is the next step if that ever matters.
#
# The branch policy of the Environment remains the boundary for WHO may
# dispatch this at all; the default-branch guard below is a rail for the
# honest mistake.
#
# NOTE: a workflow_dispatch workflow must already exist on the default branch
# before it can be run from the Actions UI, so land this file in main FIRST
# (both deploys here are manual, so merging does not auto-publish anything).
# Requires the GitHub Environment "dev" (its deployment branch policy is the
# real access boundary for the token — §1.7):
#   variable CLOUDFLARE_ACCOUNT_ID, secret CLOUDFLARE_API_TOKEN,
#   variable WORKER_FLOOR_SHA (non-secret config; MUST be set — the gate
#   refuses to run without it, because a floor already exists. It is RAISED,
#   not first filled, before the import flip — docs/ROLLBACK.md).
# Worker secrets must be set beforehand (wrangler secret put), incl. the
# MANDATORY RECOVERY_HMAC_SECRET — without it /upload returns 503.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Full 40-character commit SHA of the worker build to deploy (not a branch or tag)'
        required: true
        type: string
      # `normal` is the only profile that lets a client release follow, and the
      # Pages workflow hardcodes it. `emergency` exists for a build that
      # deliberately carries the PRE-quorum semantics: it must declare that
      # honestly and have EVERY upload switch off, which is checked before the
      # Cloudflare action runs — an unsafe build must never be activated first
      # and rejected afterwards.
      profile:
        description: 'normal (default) | emergency — emergency requires all upload switches off'
        required: false
        default: normal
        type: choice
        options: [normal, emergency]

# Least privilege for GITHUB_TOKEN (repo defaults may be write-all); this
# workflow only needs to read the code it deploys.
permissions:
  contents: read

# Serialization, NOT ordering. `concurrency` prevents two runs of this
# workflow from overlapping and `cancel-in-progress: false` stops a running
# deploy from being killed — but GitHub keeps only ONE pending run per group
# and does not promise that queued runs start in dispatch order. So the
# ordering rule is operational and belongs to the person at the keyboard:
# do not dispatch the next deploy until the previous run has finished.
# ONE group shared with "Deploy client to Cloudflare Pages — dev". Beyond the
# original reason (two dispatches of THIS workflow must not overlap), the shared
# name stops a worker deploy from landing between the client workflow's live
# /health check and its publish.
concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  # ── Job 1: run the candidate's code where there is nothing to steal ────
  #
  # No `environment:` — so no CLOUDFLARE_API_TOKEN, no WORKER_FLOOR_SHA, no
  # protected variable of any kind. The only thing this job proves is that the
  # candidate builds and passes its own suite; the deploy job below trusts
  # that verdict (`needs:`) and nothing else that happened here.
  test-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse to deploy from anything but the default branch
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT" ]; then
            echo "This workflow deploys a candidate SHA and must be dispatched from the $DEFAULT branch (was: $REF)." >&2
            exit 1
          fi
        env:
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
      # The TRUST half of the floor gate, without the floor: this job has no
      # Environment and so cannot read WORKER_FLOOR_SHA, and does not need to —
      # it decides only whether the candidate is code the default branch ever
      # contained, i.e. code that passed branch protection. Even a tokenless
      # runner should not execute a commit nobody reviewed. The full gate,
      # floor included, runs again in the deploy job.
      - name: Refuse a candidate that is not reachable from the trusted head
        run: |
          case "$CANDIDATE" in
            *[!0-9a-f]*|"") echo "candidate must be a full lowercase 40-hex SHA" >&2; exit 1 ;;
          esac
          [ "${#CANDIDATE}" -eq 40 ] || { echo "candidate must be a full 40-hex SHA" >&2; exit 1; }
          if ! git merge-base --is-ancestor "$CANDIDATE" "$TRUSTED_HEAD"; then
            echo "candidate $CANDIDATE is not reachable from the trusted head $TRUSTED_HEAD" >&2
            exit 1
          fi
        env:
          CANDIDATE: ${{ inputs.candidate }}
          TRUSTED_HEAD: ${{ github.sha }}
      - name: Materialize the candidate
        run: git worktree add --detach candidate "$CANDIDATE"
        env:
          CANDIDATE: ${{ inputs.candidate }}
      # The CANDIDATE's Node, not this branch's: `npm ci` enforces the
      # candidate's `engines` under `engine-strict`, so a rollback to a commit
      # that predates a Node bump would otherwise fail at install time.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: candidate/.nvmrc
      # ROOT deps are needed by the worker TEST suite since #104:
      # test/client-parity.test.ts imports the client's src/lib/crypto.ts,
      # which resolves @scure/bip39 from the root node_modules. --ignore-scripts
      # on purpose: the parity test only needs IMPORT RESOLUTION of pure-JS
      # packages, so no lifecycle script of a root transitive dependency runs.
      - run: npm ci --ignore-scripts
        working-directory: candidate
      - run: npm --prefix worker ci
        working-directory: candidate
      - run: npm --prefix worker run typecheck
        working-directory: candidate
      - run: npm --prefix worker test
        working-directory: candidate

  # ── Job 2: gate, materialize AGAIN, deploy — and never run the candidate ─
  deploy-worker:
    needs: test-candidate
    runs-on: ubuntu-latest
    # vars.*/secrets.* below resolve from this environment.
    environment: dev
    steps:
      # ── The trusted half: this ref's own code ──────────────────────
      # Actions are pinned to immutable commit SHAs (tags are movable — a
      # retagged/compromised action would run with the Cloudflare API token).
      # Version comments are what Dependabot bumps; verify with:
      #   git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>^{}'
      #
      # `fetch-depth: 0` is load-bearing: ancestry cannot be computed from a
      # shallow clone, and the floor gate is ancestry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing after this step talks to the remote: the candidate comes
          # out of the history fetched here, via `git worktree`. A credential
          # left in the config would only be there for candidate code to find.
          persist-credentials: false
      - name: Refuse to deploy from anything but the default branch
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT" ]; then
            echo "This workflow deploys a candidate SHA and must be dispatched from the $DEFAULT branch (was: $REF)." >&2
            exit 1
          fi
        env:
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
      # ── The gate ──────────────────────────────────────────────────
      # Runs from the TRUSTED checkout, with the floor from a protected
      # Environment variable, BEFORE any file of the candidate exists on disk.
      # Two refusals: a candidate that is not reachable from this run's own
      # commit, and a candidate below the floor. An unset floor is also a
      # refusal — a floor already exists (docs/ROLLBACK.md), so a missing
      # variable is missing configuration, not an absent constraint.
      - run: node scripts/check-worker-floor.mjs
        env:
          WORKER_FLOOR_SHA: ${{ vars.WORKER_FLOOR_SHA }}
          WORKER_CANDIDATE_SHA: ${{ inputs.candidate }}
          WORKER_TRUSTED_HEAD: ${{ github.sha }}
      # Early config gate: presence + repo-pinned expectations for NON-SECRET
      # variables only. The deploy token is deliberately NOT passed to any
      # repo script — this workflow can be dispatched from arbitrary branches
      # (--ref), and repo JS receiving the secret would hand it to whatever
      # that branch contains.
      - run: node scripts/check-deploy-config.mjs CLOUDFLARE_ACCOUNT_ID
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # ── The candidate: only now, and only in its own directory ─────
      # A FRESH materialization on a FRESH runner. The test job's copy is gone
      # with the test job's machine; nothing it did can be here.
      - name: Materialize the candidate
        run: git worktree add --detach candidate "$CANDIDATE"
        env:
          CANDIDATE: ${{ inputs.candidate }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: candidate/.nvmrc
      # ── Config gates over the CANDIDATE, executed by TRUSTED code ──
      #
      # What ships is candidate/worker/wrangler.toml. Checking the trusted
      # root's copy instead would wave through a historical rollback carrying an
      # unapproved pool and only fail after it was live. Read by scripts from
      # THIS checkout; nothing of the candidate has run, so nothing here can
      # have been rewritten — the restore-and-re-verify dance the previous
      # layout needed is no longer needed, because the thing it defended
      # against no longer happens in this job.
      - run: node scripts/check-gateways-vs-worker.mjs --config=candidate/worker/wrangler.toml
      - run: node scripts/check-trusted-owners.mjs --repo-only --config=candidate/worker/wrangler.toml
        env:
          VITE_STATUS_GATEWAYS: ${{ vars.VITE_STATUS_GATEWAYS }}
      # ── Emergency preflight, BEFORE anything is activated ──
      #
      # An emergency release is defined by every upload switch being off, and
      # discovering otherwise from a post-deploy smoke would mean the unsafe
      # build was already live. A block-scoped parser, NOT a grep:
      # [env.staging.vars] carries the same key names, so a file-wide match
      # would let a production "true" pass because staging happened to say
      # "false".
      - name: Emergency profile requires every upload switch off
        if: ${{ inputs.profile == 'emergency' }}
        run: node scripts/check-emergency-flags.mjs candidate/worker/wrangler.toml
      # ── Dependencies as DATA, never as a program ──
      #
      # `--ignore-scripts`: no lifecycle script of any candidate dependency
      # runs on this runner. wrangler needs the packages present to BUNDLE
      # the worker; it does not need them to have installed themselves. The
      # candidate's suite already ran — in the tokenless job.
      - run: npm --prefix worker ci --ignore-scripts
        working-directory: candidate
      # ── Deploy ──
      # RELEASE_SHA is injected from the VERIFIED candidate input, never from
      # github.sha — that one is the SHA of this workflow's own trusted head,
      # not of the code being deployed. /health reports it back, and the smoke
      # below refuses anything else.
      #
      # WRANGLER_OUTPUT_FILE_PATH makes wrangler write structured NDJSON; the
      # deployment's version id is read from it rather than scraped from logs.
      - id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: candidate/worker
          command: deploy --var RELEASE_SHA:${{ inputs.candidate }}
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
      # ── Read the ACTIVATED version id from the structured output ──
      # A self-declared SHA cannot distinguish a re-deploy of the same commit
      # from the original; the version id can. Parsed from the TRUSTED checkout.
      - id: version
        run: node scripts/read-wrangler-version.mjs "$OUTPUT_FILE" >> "$GITHUB_OUTPUT"
        env:
          OUTPUT_FILE: ${{ runner.temp }}/wrangler-output.ndjson
      # ── Post-deploy smoke against the live worker ──
      # Detector, not a rollback: Cloudflare activates the version before this
      # can answer. Recovery from a red smoke is roll-forward (docs/ROLLBACK.md).
      - name: Smoke the live worker
        # The profile goes through env: — no `${{ }}` inside run: anywhere
        # (§1.7): the expression expands TEXTUALLY before the shell starts.
        run: node worker/scripts/smoke-gateways.mjs --profile="$PROFILE"
        env:
          PROFILE: ${{ inputs.profile }}
          EXPECT_RELEASE_SHA: ${{ inputs.candidate }}
          EXPECT_WORKER_VERSION_ID: ${{ steps.version.outputs.version_id }}
          # Right after a deploy some edges still answer from the previous
          # version. That is propagation, not a bad release, so give the smoke
          # a minute to see the new one before it calls the release broken.
          SMOKE_DEADLINE_MS: '60000'
      # ── Hand the identity to the Pages release as an ARTIFACT ──
      #
      # A version id typed into the Pages form proves nothing: an ungated
      # redeploy of the same SHA produces a new id that its own /health will
      # happily confirm. Publishing it here, from the run that actually passed
      # the gates, is what makes the Pages check an attestation rather than an
      # echo.
      - name: Record the release identity
        run: |
          {
            echo "$CANDIDATE"
            echo "$VERSION_ID"
          } > release-identity.txt
        env:
          CANDIDATE: ${{ inputs.candidate }}
          VERSION_ID: ${{ steps.version.outputs.version_id }}
      # Pinned to a commit SHA like every other action here (verified against
      # the upstream tag, not copied from memory).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-identity
          path: release-identity.txt
          retention-days: 30
      - name: Remind the operator to raise the floor
        if: ${{ inputs.profile == 'normal' }}
        run: |
          echo "::notice::Smoke green for $CANDIDATE. Raise WORKER_FLOOR_SHA to it" \
            "BEFORE releasing the client — the control plane keeps applying the" \
            "OLD floor until the Environment variable is updated."
        env:
          CANDIDATE: ${{ inputs.candidate }}
