name: Deploy to Cloudflare Pages — dev

# Deploys the client of the WORKING (dev) contour to Cloudflare Pages (contour
# reclassified 2026-08-20; the future production gets its own `… — production`
# workflow, never this one). Cloudflare Pages parses dist/_headers, so the
# generated CSP + security headers are actually applied to responses. Builds at
# root base (VITE_BASE=/).
#
# Manual trigger; ordering is operator-driven (authoritative: docs/ROLLBACK.md).
#   Release order: "Deploy Worker (proxy) — dev" → smoke → THIS workflow
#   (reader-before-writer). The first recovery-protocol rollout used a special
#   order — recorded in ROLLBACK.md as history; the legacy GitHub Pages origin
#   is retired.
#   The header smoke-test (scripts/smoke-headers.mjs) runs against the URL after.
#
# Requires the GitHub Environment "dev" (its deployment branch policy is the
# real access boundary for the token — §1.7):
#   variables CF_PAGES_PROJECT, VITE_PROXY_URL, VITE_TRUSTED_OWNERS,
#   CLOUDFLARE_ACCOUNT_ID; secret CLOUDFLARE_API_TOKEN.
on:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN (repo defaults may be write-all); the
# Cloudflare deploy uses its own scoped API token, not this one.
permissions:
  contents: read

# Serialization, NOT ordering — the same correction made in deploy-worker.yml,
# and for the same reason: `concurrency` keeps two runs of this workflow from
# overlapping and `cancel-in-progress: false` protects a running deploy, but
# GitHub keeps only ONE pending run per group and promises nothing about the
# order queued runs start in. Do not dispatch the next deploy until the
# previous run has finished.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # vars.*/secrets.* below resolve from this environment.
    environment: dev
    steps:
      # Actions pinned to immutable commit SHAs — see deploy-worker.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Early config gate: presence + repo-pinned expectations for the four
      # NON-SECRET variables (the build reads only the VITE_* pair; the other
      # two would otherwise ride into the deploy action empty and surface
      # late). The deploy token is deliberately NOT passed to any repo script
      # — this workflow can be dispatched from arbitrary branches (--ref).
      - run: node scripts/check-deploy-config.mjs
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
          VITE_TRUSTED_OWNERS: ${{ vars.VITE_TRUSTED_OWNERS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Same source-only gate as CI: the forbidden backup-flag pair must not
      # reach a release artifact (D16).
      - run: node scripts/check-backup-flags.mjs
      # ── Quality gates ──
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm --prefix worker ci
      - run: npm --prefix worker run typecheck
      - run: npm --prefix worker test
      # Staging config gate: --dry-run validates [env.staging] (bindings,
      # migrations, vars) without auth — catches wrangler.toml drift before an
      # operator hits it during the mandatory pre-W3 smoke.
      - run: npm --prefix worker run deploy:staging:check
      # ── Build at ROOT base for Cloudflare Pages ──
      - run: npm run build
        env:
          VITE_BASE: "/"
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
          VITE_TRUSTED_OWNERS: ${{ vars.VITE_TRUSTED_OWNERS }}
          # SW updates are driven by Workbox content-hash revisions — no
          # BUILD_SHA stamping (removed with the vite-plugin-pwa migration).
      # Semantic check: the client we just built must TRUST the worker it is
      # configured to talk to — /wallet-address of the live worker has to be
      # INCLUDED in VITE_TRUSTED_OWNERS (inclusion, not equality: rotation
      # keeps old+new). Build-time validation is format-only, so this is the
      # step that catches a wrong-but-well-formed owner list before deploy.
      # Same command CI runs on its own build: the three viewer invariants that
      # only exist after one. A deploy can be dispatched from an arbitrary ref,
      # so CI having proved them for a DIFFERENT build proves nothing about the
      # bytes this job is seconds away from publishing.
      - run: node scripts/verify-viewer-dist.mjs
      - run: node scripts/check-owners-vs-worker.mjs
        env:
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
          VITE_TRUSTED_OWNERS: ${{ vars.VITE_TRUSTED_OWNERS }}
      # Bundle budget: fail before deploying if the gzipped JS quietly grew
      # past the declared ceiling (see scripts/check-bundle-budget.mjs).
      - run: node scripts/check-bundle-budget.mjs
      # Font pipeline: an inlined font is BLOCKED by `font-src 'self'` and
      # falls back silently, and a per-weight @fontsource import silently drags
      # in every subset. Both are invisible at runtime — hence a build gate.
      - run: node scripts/check-no-inlined-fonts.mjs
      # ── Deploy ──
      # wrangler itself comes from the ROOT lockfile (devDependency): the
      # action prefers the locally installed CLI over downloading one at
      # runtime, so the tool that runs WITH the API token is pinned and
      # Dependabot-updated like everything else.
      - id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }}
      # ── Post-deploy security gate: prove the CSP + headers are actually applied.
      #     Fails the run if they are missing (e.g. a misconfigured Pages project).
      #     The URL goes through env: — no ${{ }} inside run: anywhere (§1.7):
      #     the expression expands TEXTUALLY before the shell starts, so any
      #     third-party value would land directly on the command line. ──
      - run: node scripts/smoke-headers.mjs "$DEPLOY_URL"
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
