name: Deploy to GitHub Pages

# Manual trigger so the client (Pages) is NEVER auto-published ahead of the
# Worker. Reader-before-writer rollout is operator-driven:
#   1. merge to main (nothing deploys),
#   2. run "Deploy Worker (proxy)" and smoke-test it,
#   3. then run this workflow to publish the client.
# (Phase 3 migrates this to Cloudflare Pages and finalizes the runbook.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ── Quality gates (must pass before build/deploy) ──
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm --prefix worker ci
      - run: npm --prefix worker run typecheck
      - run: npm --prefix worker test
      # ── Build ──
      - run: npm run build
        env:
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
          VITE_TRUSTED_OWNERS: ${{ secrets.VITE_TRUSTED_OWNERS }}
      - run: cp dist/index.html dist/404.html
      - run: sed -i "s/__BUILD_HASH__/$(git rev-parse --short HEAD)/" dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
