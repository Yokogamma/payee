name: Deploy to GitHub Pages (legacy)

# LEGACY target. Cloudflare Pages (deploy-pages-cf.yml) is the migration target
# because GitHub Pages ignores _headers, so the generated CSP is NOT applied here.
# Kept working (base=/payee/) until the operator completes the CF Pages cutover.
# Manual trigger — ordering is operator-driven (authoritative: docs/ROLLBACK.md).
# NOTE: for the FIRST rollout of the recovery protocol THIS legacy client deploy
# goes FIRST — before the new Worker — because the recovery-aware client is
# backward-compatible with the old Worker, while the new Worker paired with old
# clients opens the duplicate-paid-TX window. Later releases: Worker first.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ── Quality gates (must pass before build/deploy) ──
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm --prefix worker ci
      - run: npm --prefix worker run typecheck
      - run: npm --prefix worker test
      # ── Build (base=/payee/ default; postbuild stamps SW hash + writes _headers) ──
      - run: npm run build
        env:
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
          VITE_TRUSTED_OWNERS: ${{ secrets.VITE_TRUSTED_OWNERS }}
          # SW updates are driven by Workbox content-hash revisions — no
          # BUILD_SHA stamping (removed with the vite-plugin-pwa migration).
      # GitHub Pages has no _redirects support → SPA fallback via 404.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
